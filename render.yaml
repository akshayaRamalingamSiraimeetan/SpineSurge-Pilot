# Render blueprint for the hosted demo (see docs/DEPLOYMENT.md).
# New → Blueprint → pick this repo. Fill the `sync: false` values in the dashboard.
services:
  - type: web
    name: spinesurge-demo
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spinesurge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE
        value: "true"
      - key: DEMO_USER_EMAIL
        sync: false
      - key: DEMO_USER_PASSWORD
        sync: false
      - key: DEMO_USER_NAME
        value: Demo Surgeon
      - key: VITE_DEMO_EMAIL      # build arg: pre-fills the login form
        sync: false
      - key: VITE_DEMO_PASSWORD
        sync: false
      - key: UPLOADS_DIR
        value: /data/uploads

databases:
  - name: spinesurge-db
    plan: basic-256mb
    region: singapore
    databaseName: spinesurge
