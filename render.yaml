# Render blueprint — FREE demo setup (docs/FREE_DEPLOY.md). No card needed.
#   App:            this web service (free instance: sleeps after 15 min idle, ~1 min to wake)
#   Database+files: Supabase free (Postgres + Storage bucket "uploads")
#   Email codes:    Brevo free (HTTP API — free hosts block SMTP)
# New → Blueprint → this repo, branch demo-deploy → fill the values marked sync:false.
# (Paid always-on variant with a disk + Render Postgres: see docs/DEPLOYMENT.md.)
services:
  - type: web
    name: spinesurge-demo
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      # Supabase → Connect → "Session pooler" connection string (IPv4), with your DB password filled in
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_POOL_MAX     # Supabase free pooler allows few connections
        value: "5"
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE             # no email code only while email is not configured
        value: "true"
      # Uploaded images/CT/report PDFs → Supabase Storage (S3-compatible)
      - key: S3_ENDPOINT           # Supabase → Storage → S3 Configuration → Endpoint
        sync: false
      - key: S3_REGION             # same page → Region (e.g. ap-south-1)
        sync: false
      - key: S3_BUCKET
        value: uploads
      - key: S3_ACCESS_KEY_ID      # same page → New access key
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Sign-up codes to the user's own inbox
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY         # Brevo → SMTP & API → API keys
        sync: false
      - key: EMAIL_FROM            # a sender verified in Brevo, e.g. SpineSurge <you@gmail.com>
        sync: false
      # Who sees the live Monitor and can block accounts (comma separated login emails); not monitored themselves
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
