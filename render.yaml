# Render blueprint for the hosted demo (see docs/DEPLOYMENT.md).
# New → Blueprint → pick this repo. Fill the `sync: false` values in the dashboard.
services:
  - type: web
    name: spinesurge-demo
    runtime: docker
    plan: starter            # a persistent disk needs a paid instance
    region: singapore
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 10           # CT series are 100+ MB each
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: spinesurge-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: DEMO_MODE            # no email code while EMAIL_PROVIDER is unset/mock
        value: "true"
      # Sign-up codes to the user's own inbox (Gmail: app password, port 587).
      # Once EMAIL_PROVIDER=smtp is set, every sign-up must confirm its email.
      - key: EMAIL_PROVIDER
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER            # the sending Gmail address
        sync: false
      - key: SMTP_PASS            # its 16-character app password
        sync: false
      - key: EMAIL_FROM           # e.g. SpineSurge <you@gmail.com>
        sync: false
      # Who sees the Usage dashboard (comma separated login emails)
      - key: PLATFORM_ADMIN_EMAILS
        sync: false
      - key: UPLOADS_DIR
        value: /data/uploads

databases:
  - name: spinesurge-db
    plan: basic-256mb
    region: singapore
    databaseName: spinesurge
