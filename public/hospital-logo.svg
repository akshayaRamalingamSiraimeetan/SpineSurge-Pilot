<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Background circle -->
  <circle cx="50" cy="50" r="48" fill="#2563EB" stroke="#1E3A8A" stroke-width="1"/>
  
  <!-- White medical cross (simplified) -->
  <g fill="white">
    <!-- Vertical bar -->
    <rect x="42" y="28" width="16" height="44" rx="2"/>
    <!-- Horizontal bar -->
    <rect x="28" y="42" width="44" height="16" rx="2"/>
  </g>
  
  <!-- Subtle spine outline to the right -->
  <g stroke="#E0E7FF" stroke-width="1" fill="none" opacity="0.6">
    <circle cx="65" cy="35" r="2"/>
    <circle cx="65" cy="42" r="2"/>
    <circle cx="65" cy="49" r="2"/>
    <circle cx="65" cy="56" r="2"/>
    <circle cx="65" cy="63" r="2"/>
    <line x1="62" y1="35" x2="68" y2="35"/>
    <line x1="62" y1="42" x2="68" y2="42"/>
    <line x1="62" y1="49" x2="68" y2="49"/>
    <line x1="62" y1="56" x2="68" y2="56"/>
    <line x1="62" y1="63" x2="68" y2="63"/>
  </g>
</svg>