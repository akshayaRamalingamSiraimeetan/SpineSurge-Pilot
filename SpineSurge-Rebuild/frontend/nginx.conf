# Serves the built SPA with cross-origin isolation for the cornerstone/VTK WASM workers.
# `credentialless` (not require-corp) so cross-origin subresources (S3 images, WADO via the api
# proxy) still load while keeping crossOriginIsolated === true. Mirrors vite.config.ts.

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  # WASM must be served with the correct type for streaming compilation.
  types {
    application/wasm wasm;
  }
  include /etc/nginx/mime.types;

  # Cross-origin isolation (required for SharedArrayBuffer + threaded WASM decoders).
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Embedder-Policy "credentialless" always;
  add_header Cross-Origin-Resource-Policy "cross-origin" always;

  # Long-cache fingerprinted assets; never cache the entry HTML.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    try_files $uri =404;
  }

  # SPA fallback: client-side routes (/workspace/:id, /dicom-verify, …) resolve to index.html.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
